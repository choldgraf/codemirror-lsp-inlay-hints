version: 1
extends:
  - https://raw.githubusercontent.com/myst-contrib/myst-contrib.github.io/main/docs/footer.yml
project:
  id: codemirror-lsp-inlay-hints
  title: codemirror-lsp-inlay-hints
  github: https://github.com/choldgraf/codemirror-lsp-inlay-hints
